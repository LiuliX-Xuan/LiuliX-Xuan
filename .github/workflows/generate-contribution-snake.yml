name: Generate contribution snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution GIF
        uses: Platane/snk@v3
        with:
          github_user_name: LiuliX-Xuan
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=%238be9fd&color_dots=%23d5d7ff,%23b8a6ff,%239876ff,%237056e8,%234c3dbc&color_background=%23090c20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated GIF
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
